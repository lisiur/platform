# Example of the operator-owned TLS server block.
#
# This file does NOT ship the app `location` blocks — those are generated into
# nginx/apps/*.conf by scripts/gen-nginx.mjs (from scripts/apps.json) and packed
# in the tarball. You add a SINGLE `include` line (below) to YOUR existing
# server block, once. After that, every release is just: extract the new
# tarball over the deploy dir, then `sudo nginx -t && sudo nginx -s reload`.
#
# Why a one-line include (and not "merge the location blocks"): nginx forbids a
# `server { }` inside another `server { }`, so the old monolithic template could
# not be included as-is. Splitting the portable location blocks out lets the
# repo own them while you keep ownership of TLS / server_name.

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ... YOUR SSL certificate + any other site-specific directives ...
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ONE-TIME SETUP: point this at the tarball's extract dir on your host
    # (where nginx/apps/*.conf lives). Replace /path/to/platform below with
    # your real deploy directory, e.g. /home/deploy/platform or /opt/platform.
    include /path/to/platform/nginx/apps/*.conf;
}
