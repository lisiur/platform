name: build

# Builds the platform monorepo on a native linux/amd64 runner and packages the
# Next.js standalone artifacts into a self-contained tarball ready to deploy
# under PM2 (ecosystem.standalone.cjs + .env.production.example bundled in).
# Native deps (argon2, Prisma engines, ...) install
# for the target arch on the runner.
#
# Outputs:
#   - Workflow artifact: platform-deploy-linux-<arch>.tar.gz  (every run)
#   - Release asset:       attached to v* tags

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.11.0'
  # Pinned build target. The tarball bakes in native deps (argon2, Prisma
  # engines, ...) for this arch, so the asset name encodes it. When adding an
  # arm64 runner (matrix), set these per matrix leg.
  TARGET_OS: linux
  TARGET_ARCH: amd64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed only to attach the tarball to a GitHub release on version tags.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          # prisma generate never connects; the placeholder only satisfies
          # prisma.config.ts parsing.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm db:generate

      - name: Build (Next.js standalone)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Optional: bake a specific API origin into the client bundle.
          # Set as a repository variable (Settings → Secrets and variables → Actions).
          NEXT_PUBLIC_API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_ORIGIN }}
          # Bake the released version (git tag) + sha into the bundles.
          APP_VERSION: ${{ github.ref_name }}
          APP_GIT_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Assemble and pack deploy tarball
        env:
          SRC_ROOT: ${{ github.workspace }}
          OUT: ${{ github.workspace }}/deploy
          OS: ${{ env.TARGET_OS }}
          ARCH: ${{ env.TARGET_ARCH }}
        run: sh scripts/assemble.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-deploy-${{ env.TARGET_OS }}-${{ env.TARGET_ARCH }}
          path: platform-deploy-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platform-deploy-*.tar.gz
